[package]
name = "cerebro-gui"
version = "1.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Cerebro GUI — Tauri 2.0 desktop app for personal knowledge management"
license = "MIT"
authors = ["Ed Barczynski"]

[dependencies]
cerebro = { path = "../.." }
tauri = { version = "2", features = ["devtools"] }
# The only plugin the frontend uses (vault / file pickers). Unused plugins
# are not compiled in: they would only widen what the webview is allowed to do.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
tokio = { version = "1", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
base64 = "0.22"
notify = { version = "7", features = ["macos_kqueue"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
