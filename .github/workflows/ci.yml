name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest # x86_64
            name: linux-x86_64
          - os: macos-14 # Apple Silicon (M1, arm64)
            name: macos-aarch64
    runs-on: ${{ matrix.os }}
    name: build & test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/gui/frontend/package-lock.json

      - name: Install Linux system deps (Tauri/WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Build frontend
        working-directory: crates/gui/frontend
        run: |
          npm ci
          npm run build

      # The GUI crate embeds frontend/dist via generate_context! at compile
      # time, so the frontend build must precede any cargo build.
      - name: Run tests (workspace)
        run: cargo test --workspace

      - name: Build CLI (release)
        run: cargo build --release -p cerebro

      - name: Build GUI binary (release, Linux only to bound macOS minutes)
        if: runner.os == 'Linux'
        run: cargo build --release -p cerebro-gui

      - name: Smoke-test CLI binary
        run: ./target/release/cerebro --version
