name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest # x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/gui/frontend/package-lock.json

      - name: Install Linux system deps (Tauri/WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Build frontend
        working-directory: crates/gui/frontend
        run: |
          npm ci
          npm run build

      - name: Build CLI (release)
        run: cargo build --release -p cerebro

      - name: Package CLI
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar czf "cerebro-${VERSION}-linux-x86_64.tar.gz" -C target/release cerebro
          sha256sum "cerebro-${VERSION}-linux-x86_64.tar.gz" > "cerebro-${VERSION}-linux-x86_64.tar.gz.sha256"

      - name: Build GUI bundle (deb)
        # tauri-cli v2 discovers the project from CWD + SUBFOLDERS only —
        # from frontend/ it panics (no conf below it). Run from crates/gui
        # with the frontend's local bin; beforeBuildCommand handles npm.
        working-directory: crates/gui
        run: frontend/node_modules/.bin/tauri build --bundles deb

      - name: Stage artifacts
        run: |
          mkdir -p artifacts
          cp cerebro-*.tar.gz cerebro-*.sha256 artifacts/
          cp target/release/bundle/deb/*.deb artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux-x86_64
          path: artifacts/*
          if-no-files-found: error

  build-macos:
    runs-on: macos-26 # Apple Silicon, macOS 26 (Tahoe) — we target macOS 26+
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/gui/frontend/package-lock.json

      - name: Build frontend
        working-directory: crates/gui/frontend
        run: |
          npm ci
          npm run build

      - name: Build CLI (release, arm64)
        run: cargo build --release -p cerebro

      - name: Package CLI
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar czf "cerebro-${VERSION}-macos-aarch64.tar.gz" -C target/release cerebro
          shasum -a 256 "cerebro-${VERSION}-macos-aarch64.tar.gz" > "cerebro-${VERSION}-macos-aarch64.tar.gz.sha256"

      - name: Build GUI app bundle (arm64)
        # Same as Linux: discover from crates/gui, use frontend's local bin.
        # Only the .app is built here — the DMG is created deterministically
        # with hdiutil below (tauri's bundle_dmg.sh drives Finder via
        # AppleScript, which new runner images may not authorize).
        working-directory: crates/gui
        run: frontend/node_modules/.bin/tauri build --bundles app

      - name: Verify ad-hoc code signature
        # Unsigned bundles trigger macOS Sequoia's "app is damaged" error when
        # downloaded — signingIdentity "-" ad-hoc signs in tauri.conf.json; fail
        # the build rather than shipping a bundle Gatekeeper rejects.
        run: |
          codesign --verify --deep --strict target/release/bundle/macos/Cerebro.app
          echo "✅ Ad-hoc signature valid"
          codesign -dv target/release/bundle/macos/Cerebro.app 2>&1 | head -5

      - name: Package DMG (hdiutil, no Finder automation)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGING=$(mktemp -d)
          cp -R target/release/bundle/macos/Cerebro.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          mkdir -p target/release/bundle/dmg
          hdiutil create -volname Cerebro \
            -srcfolder "$STAGING" -ov -format UDZO \
            "target/release/bundle/dmg/Cerebro_${VERSION}_aarch64.dmg"
          hdiutil verify "target/release/bundle/dmg/Cerebro_${VERSION}_aarch64.dmg"

      - name: Stage artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          cp cerebro-*.tar.gz cerebro-*.sha256 artifacts/
          cp target/release/bundle/dmg/*.dmg artifacts/
          tar czf "Cerebro-${VERSION}-macos-aarch64.app.tar.gz" -C target/release/bundle/macos Cerebro.app
          cp "Cerebro-${VERSION}-macos-aarch64.app.tar.gz" artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos-aarch64
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: release

      - name: List artifacts
        run: ls -la release/

      - name: Write release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > NOTES.md <<EOF
          # Cerebro v${VERSION}

          **Cerebro** is a local-first personal knowledge base that grows the graph
          for you: write Markdown, link with \`[[wikilinks]]\`, and let keyword
          analysis surface connections you didn't notice. Plain files, no cloud.

          ## 🆕 New in this release

          - 🎨 **New app icon** — minimal brain-circuit mark across macOS,
            Windows and Linux, plus the in-app top bar, welcome screen and favicon.

          **Capabilities:** Markdown notes + \`[[wikilinks]]\` · full-text search
          (FTS5) · automatic keyword links · Obsidian-style knowledge graph ·
          💠 Obsidian vault import (folder structure, frontmatter tags, wikilinks) ·
          document import (PDF/DOCX/XLSX/PPTX and more) · 🔒/💼 vaults with recents ·
          keyboard shortcuts help (\`?\`) · MCP server · Confluence connector · CLI.

          ## 🍎 macOS (Apple Silicon) — requires macOS 26 (Tahoe) or newer

          | File | What it is |
          |---|---|
          | \`Cerebro_${VERSION}_aarch64.dmg\` | Installer — drag to /Applications |
          | \`Cerebro-${VERSION}-macos-aarch64.app.tar.gz\` | Portable app bundle |
          | \`cerebro-${VERSION}-macos-aarch64.tar.gz\` | CLI binary (arm64) |

          > Ad-hoc signed build (no Apple Developer certificate). Gatekeeper still
          > warns on first launch — that's expected: right-click → Open, or run
          > \`xattr -cr /Applications/Cerebro.app\`. It will **not** show
          > "damaged/corrupted" anymore; if you see that, please open an issue.

          ## 🐧 Linux (x86_64)

          | File | What it is |
          |---|---|
          | \`Cerebro_${VERSION}_amd64.deb\` | Debian/Ubuntu package (pulls WebKitGTK) |
          | \`cerebro-${VERSION}-linux-x86_64.tar.gz\` | CLI binary (x86_64) |

          Other distros: build from source (GUI needs WebKitGTK 4.1 dev packages).

          All CLI archives ship with \`.sha256\` checksums.

          *Built automatically by GitHub Actions on ubuntu-latest (x86_64) and
          macos-26 (Apple Silicon, deployment target macOS 26).*
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Cerebro ${{ github.ref_name }}" # ref_name already includes the v
          body_path: NOTES.md
          files: release/*
          fail_on_unmatched_files: true
